import base64, io, requests
from PIL import Image

URL = "https://images6.alphacoders.com/618/618452.jpg"
W, H = 1600, 440

# Download and crop to banner size
img = Image.open(io.BytesIO(requests.get(URL, timeout=30).content)).convert("RGB")
scale = max(W / img.width, H / img.height)
img = img.resize((int(img.width * scale), int(img.height * scale)))
left, top = (img.width - W) // 2, (img.height - H) // 2
img = img.crop((left, top, left + W, top + H))

buf = io.BytesIO()
img.save(buf, "JPEG", quality=78, optimize=True)
b64 = base64.b64encode(buf.getvalue()).decode()

svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}">
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f0c29" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0f3460" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .name {{ font: 800 84px 'Segoe UI', Arial, sans-serif; fill: #00F7FF; letter-spacing: 4px;
               animation: fade 1.6s ease-out both; }}
      .sub  {{ font: 500 28px 'Segoe UI', Arial, sans-serif; fill: #d6ecf5;
               animation: fade 2.2s ease-out both; }}
      @keyframes fade {{ from {{ opacity: 0; }} to {{ opacity: 1; }} }}
    </style>
  </defs>
  <image href="data:image/jpeg;base64,{b64}" width="{W}" height="{H}" preserveAspectRatio="xMidYMid slice"/>
  <rect width="{W}" height="{H}" fill="url(#shade)"/>
  <text x="50%" y="48%" text-anchor="middle" class="name" filter="url(#glow)">CHELLA MUTHU KUMAR</text>
  <text x="50%" y="66%" text-anchor="middle" class="sub">Web Developer  |  UI/UX Designer  |  AI Automation Builder</text>
</svg>'''

open("banner.svg", "w", encoding="utf-8").write(svg)
print("banner.svg created:", round(len(svg) / 1024), "KB")
